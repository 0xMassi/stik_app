name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Check platform declarations
        run: bun run check:platform

      - name: Typecheck and build
        run: bun run build

      - name: Enforce bundle budget
        run: bun run check:bundle

      - name: Test
        run: bun run test

  swift:
    name: Swift
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Test DarwinKit sidecar
        run: swift test --package-path src-tauri/darwinkit

  rust:
    name: Rust
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install protobuf compiler
        run: brew install protobuf

      - name: Stub the DarwinKit sidecar
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p src-tauri/binaries
          printf '#!/bin/sh\nexit 0\n' > "src-tauri/binaries/darwinkit-$target"
          chmod +x "src-tauri/binaries/darwinkit-$target"

      - name: Build the frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.1,cargo-deny@0.20.2

      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Enforce Rust advisory policy
        run: cargo deny --manifest-path src-tauri/Cargo.toml check advisories
